<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Set • Character preview</title><link rel="stylesheet" href="style.css"><style>
body{max-width:1100px;margin:auto;padding:24px}header{margin:10px 0 24px}h1{margin-bottom:10px}h2{margin:20px 0 12px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.slot{border:2px solid var(--border);border-radius:20px;padding:18px;background:var(--card)}.samples{display:flex;gap:18px;align-items:end;justify-content:center;min-height:220px}.big{width:128px;height:192px;object-fit:fill;image-rendering:pixelated}.label{font-size:13px;overflow-wrap:anywhere;margin-top:16px}.portraits .big{width:128px;height:128px}.palette{margin:24px 0;padding:20px;border-radius:24px;background:var(--screen)}.night{--screen:#214438;--card:#2d5043;--ink:#e4e9cd;--muted:#bcd0b2;--border:#101f1b;color:var(--ink)}.guide{max-width:760px;line-height:1.6}a{color:inherit}.controls button{padding:12px 18px;border:1px solid var(--border);background:var(--card)}
</style><header><h1>Make it yours</h1><p class="guide">Character-only preview. No account, real weights or database connection. Check every image at full and phone sizes. Replace Lucie's example character with your own before sharing a personalized fork.</p></header><main id="preview"></main><script>
const names=['total-body','chest-back','arms','lower-body','abs-ass','upper-body'];
const section=(night=false)=>`<section class="palette ${night?'night':''}"><h2>${night?'Night':'Day'} palette</h2><div class="gallery">${names.map(n=>`<article class="slot"><div class="samples"><img class="big" src="assets/characters/${n}.png" alt="${n} pose at larger size"><span class="sprite"><img src="assets/characters/${n}.png" alt="${n} pose at phone size"></span></div><p class="label">${n}.png</p></article>`).join('')}</div><h2>Portraits</h2><div class="gallery portraits">${['profile','celebrate'].map(n=>`<article class="slot"><div class="samples"><img class="big" src="assets/characters/${n}.png" alt="${n} portrait at larger size"><span class="portrait"><img src="assets/characters/${n}.png" alt="${n} portrait at phone size"></span></div><p class="label">${n}.png</p></article>`).join('')}</div></section>`;
document.querySelector('#preview').innerHTML=section()+section(true);
</script></html>
